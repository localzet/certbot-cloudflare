services:
  certbot:
    build:
      context: .
    container_name: certbot-cloudflare
    environment:
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:?Set CERTBOT_EMAIL}"
      CERTBOT_DOMAINS: "${CERTBOT_DOMAINS:?Set CERTBOT_DOMAINS}"
      CERTBOT_CERT_NAME: "${CERTBOT_CERT_NAME:-default-cert}"
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN:?Set a scoped Cloudflare DNS API token}"
    volumes:
      - ./certs:/etc/letsencrypt
    restart: unless-stopped
